name: Validate knowledge base

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install validation dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Validate knowledge, schemas and references
        run: python tools/validate_knowledge.py
      - name: Verify Navigator catalog is current
        run: python tools/build_catalog.py --check
      - name: Build detection coverage artifact
        run: python tools/build_coverage.py --out /tmp/fraudintelligence-coverage.json
      - name: Build STIX 2.1 export
        run: python tools/export_stix.py --out /tmp/fraudintelligence-stix.json
      - name: Build TAXII-ready package
        run: python tools/build_taxii_package.py --out /tmp/fraudintelligence-taxii
      - name: Build intelligence products
        run: python tools/build_products.py --out /tmp/fraudintelligence-products
      - name: Build intelligence graph
        run: python tools/build_graph.py --json-out /tmp/fraudintelligence-graph.json --graphml-out /tmp/fraudintelligence.graphml
