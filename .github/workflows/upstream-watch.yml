name: Watch upstream fraud frameworks

on:
  workflow_dispatch:
  schedule:
    - cron: "17 8 * * 1"

permissions:
  contents: read

jobs:
  upstream:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Sync source-native F3 and FT3 data
        run: python tools/sync_frameworks.py

      - name: Upload source manifest
        uses: actions/upload-artifact@v4
        with:
          name: fraud-framework-upstream-manifest
          path: .cache/upstream/manifest.json
          retention-days: 30
