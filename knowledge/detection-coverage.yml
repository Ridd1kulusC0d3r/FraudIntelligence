      - unusual API scope or service access by high-privilege identities
    telemetry:
      - cloud identity provider logs
      - cloud audit and API activity
    attack_data_components:
      - {id: DC0002, name: User Account Authentication}
    attack_detection_strategies:
      - {id: DET0546, name: Detection of Abused or Compromised Cloud Accounts for Access and Persistence}
    analytics:
      - identify privileged cloud use that deviates from normal account and service scope
    controls:
      - phishing-resistant MFA
      - workload identity separation
      - credential revocation
    d3fend:
      - {id: D3-MFA, name: Multi-factor Authentication}
      - {id: D3-CE, name: Credential Eviction}
    coverage: partial
    maturity: concept
    last_reviewed: "2026-10-01"
    notes: >
      This is a defensive crosswalk, not a claim that every cloud-account event is
      attributable to BREEZE COMET.

